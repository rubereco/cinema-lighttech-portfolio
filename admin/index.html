<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Content Manager · Recalone</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%230b0b0d'/%3E%3Ctext x='50' y='68' font-family='sans-serif' font-size='60' font-weight='700' fill='%23E8A33D' text-anchor='middle'%3ER%3C/text%3E%3C/svg%3E" />
  <style>
    /* v3.14.4: !important on body bg so Decap's CSS can't
       flip us to its light theme. The boot screen stays
       dark no matter what Decap does to <body>. */
    html, body {
      background: #0b0b0d !important;
      color: #e8e8e8 !important;
      margin: 0 !important;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif !important;
    }
    .boot {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      flex-direction: column;
      gap: 1rem;
      padding: 2rem;
    }
    .boot__title {
      font-size: 1.1rem;
      color: #7a7a7e;
      letter-spacing: 0.04em;
    }
    .boot__progress {
      font-size: 0.85rem;
      color: #4a4a4e;
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, monospace;
    }
    .boot__error {
      max-width: 720px;
      padding: 1.5rem;
      background: #1c1c20;
      border: 1px solid #3a1f1f;
      border-left: 3px solid #f87171;
      border-radius: 8px;
      color: #e8e8e8;
    }
    .boot__error h2 {
      color: #f87171;
      font-size: 1rem;
      margin: 0 0 0.5rem 0;
    }
    .boot__error pre {
      background: #0b0b0d;
      padding: 0.75rem;
      border-radius: 4px;
      overflow-x: auto;
      font-size: 0.8rem;
      line-height: 1.5;
      color: #c8c8c8;
      white-space: pre-wrap;
    }
    .boot__hint {
      font-size: 0.8rem;
      color: #7a7a7e;
      line-height: 1.5;
      max-width: 720px;
    }
    .boot__hint code {
      background: #1c1c20;
      padding: 0.15rem 0.4rem;
      border-radius: 3px;
      color: #E8A33D;
    }
    /* v3.14.8: debug panel — temporary, helps diagnose the
       OAuth postMessage flow. REMOVE before final commit. */
    .debug {
      position: fixed;
      bottom: 12px;
      right: 12px;
      max-width: 420px;
      max-height: 60vh;
      overflow-y: auto;
      background: rgba(12, 12, 14, 0.95);
      border: 1px solid #3a1f1f;
      border-left: 3px solid #E8A33D;
      border-radius: 6px;
      padding: 0.75rem 1rem;
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, monospace;
      font-size: 11px;
      line-height: 1.5;
      color: #c8c8c8;
      z-index: 9999;
      box-shadow: 0 4px 16px rgba(0,0,0,0.5);
    }
    .debug__title {
      color: #E8A33D;
      font-weight: 600;
      margin: 0 0 0.5rem 0;
      font-size: 11px;
      letter-spacing: 0.04em;
    }
    .debug__close {
      position: absolute;
      top: 6px;
      right: 8px;
      background: none;
      border: none;
      color: #7a7a7e;
      cursor: pointer;
      font-size: 14px;
      padding: 0;
      line-height: 1;
    }
    .debug__close:hover { color: #e8e8e8; }
    .debug__row {
      padding: 2px 0;
      border-bottom: 1px solid rgba(255,255,255,0.04);
    }
    .debug__row:last-child { border-bottom: none; }
    .debug__time { color: #6a6a6e; }
    .debug__ok  { color: #4ade80; }
    .debug__err { color: #f87171; }
    .debug__info { color: #c8c8c8; }
    .debug__raw  { color: #9b9b9e; word-break: break-all; }
  </style>
</head>
<body>
  <!--
    Decap CMS admin panel. Loads the editor from a CDN, then auto-detects
    config.yml in this same directory and renders the editor UI.

    CDN order: jsDelivr first, unpkg as fallback. If both fail, we show
    a clear error message instead of a silent dark page.
  -->
  <div class="boot" id="boot">
    <p class="boot__title">Loading content manager…</p>
    <p class="boot__progress" id="boot-status">Loading Decap CMS from jsDelivr</p>
  </div>

  <!-- v3.14.8: temporary debug panel — REMOVE before final commit -->
  <div class="debug" id="debug" style="display:none">
    <button class="debug__close" type="button" id="debug-close" aria-label="Close">×</button>
    <p class="debug__title">DEBUG PANEL (v3.14.8 — temporary)</p>
    <div id="debug-log"></div>
  </div>

  <script>
    // Show the loading state immediately, then track Decap's progress.
    window.addEventListener("error", function (event) {
      showError(
        "Page script error",
        (event.error && event.error.stack) || event.message || "Unknown error"
      );
    });

    function setStatus(text) {
      var el = document.getElementById("boot-status");
      if (el) el.textContent = text;
    }

    function showError(title, details) {
      var boot = document.getElementById("boot");
      if (!boot) return;
      boot.innerHTML =
        '<div class="boot__error">' +
          '<h2>' + title + '</h2>' +
          '<pre>' + escapeHtml(String(details)) + '</pre>' +
        '</div>' +
        '<p class="boot__hint">' +
          'Common causes: <br>' +
          '• Invalid <code>config.yml</code> (check browser console for parse errors) <br>' +
          '• CDN blocked (try a different network) <br>' +
          '• <code>base_url</code> in config.yml doesn\'t match the deployed Worker URL <br>' +
          'Open the browser DevTools (F12) → Console tab for the full error.' +
        '</p>';
    }

    function escapeHtml(s) {
      return s
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    // ─── v3.14.8: Debug panel — temporary ──────────────────────────
    // Capture every interesting event so we can see exactly what
    // happens during the OAuth flow. REMOVE this whole block
    // (debug panel markup + this script + the .debug CSS) before
    // final commit to production.
    (function setupDebug() {
      // Show panel unless ?nodebug is in the URL
      var url = new URL(window.location.href);
      if (url.searchParams.get("nodebug") === null) {
        var panel = document.getElementById("debug");
        if (panel) panel.style.display = "block";
        var closeBtn = document.getElementById("debug-close");
        if (closeBtn) {
          closeBtn.addEventListener("click", function () {
            panel.style.display = "none";
          });
        }
      }

      // Expose a global log function
      window.__debugLog = function (label, type, data) {
        var log = document.getElementById("debug-log");
        if (!log) return;
        var now = new Date();
        var time = now.toTimeString().slice(0, 8);
        var row = document.createElement("div");
        row.className = "debug__row";
        var timeSpan = '<span class="debug__time">[' + time + ']</span> ';
        var labelSpan = '<span class="debug__' + type + '">' + escapeHtml(label) + '</span>';
        var dataSpan = "";
        if (data !== undefined) {
          try {
            var dataStr = typeof data === "string" ? data : JSON.stringify(data);
            if (dataStr.length > 200) dataStr = dataStr.slice(0, 200) + "…";
            dataSpan = '<div class="debug__raw">' + escapeHtml(dataStr) + "</div>";
          } catch (e) {
            dataSpan = '<div class="debug__raw">[unserializable]</div>';
          }
        }
        row.innerHTML = timeSpan + labelSpan + dataSpan;
        log.insertBefore(row, log.firstChild);
        // Keep the log to the last 50 entries
        while (log.children.length > 50) {
          log.removeChild(log.lastChild);
        }
      };

      // Capture all window.message events (this is the key one —
      // if the postMessage from the Worker arrives, we'll see it here)
      window.addEventListener("message", function (event) {
        var origin = event.origin;
        var data = event.data;
        var type = (typeof data === "string" && data.indexOf("authorization:") === 0)
          ? "ok"
          : "info";
        window.__debugLog("window.message received", type, {
          origin: origin,
          dataType: typeof data,
          data: data
        });
      });

      // Capture URL changes (Decap navigates to /#/ after auth)
      var lastUrl = location.href;
      setInterval(function () {
        if (location.href !== lastUrl) {
          window.__debugLog("URL changed", "info", {
            from: lastUrl,
            to: location.href
          });
          lastUrl = location.href;
        }
      }, 200);

      // Initial state
      window.__debugLog("Page loaded", "info", {
        href: location.href,
        search: location.search
      });
    })();

    // Try loading Decap from jsDelivr first.
    function loadDecap(url) {
      return new Promise(function (resolve, reject) {
        var script = document.createElement("script");
        script.src = url;
        script.async = false;
        script.onload = function () { resolve(url); };
        script.onerror = function () { reject(new Error("Failed to load: " + url)); };
        document.head.appendChild(script);
      });
    }

    (async function () {
      // Make sure unhandled errors hit our error UI.
      window.addEventListener("unhandledrejection", function (event) {
        showError("Unhandled error", (event.reason && event.reason.stack) || event.reason);
      });

      // v3.14.3: 3.7.4 was never published (Decap jumped 3.7.2 → 3.8.0
      // on npm). Bumped to 3.15.1 (latest stable as of 2026-08-05).
      // Version is pinned (not @latest) so a future breaking change
      // upstream can't silently break the admin.
      var version = "3.15.1";
      var sources = [
        "https://cdn.jsdelivr.net/npm/decap-cms@" + version + "/dist/decap-cms.js",
        "https://unpkg.com/decap-cms@" + version + "/dist/decap-cms.js",
      ];

      for (var i = 0; i < sources.length; i++) {
        try {
          setStatus("Loading Decap CMS (try " + (i + 1) + "/" + sources.length + ")…");
          await loadDecap(sources[i]);
          if (window.__debugLog) window.__debugLog("Script loaded: " + sources[i], "ok");
          setStatus("Decap loaded, initializing editor…");
          break;
        } catch (err) {
          if (window.__debugLog) window.__debugLog("CDN failed: " + sources[i], "err", err.message);
          if (i === sources.length - 1) {
            showError(
              "Could not load Decap CMS",
              "Tried both CDNs and both failed:\n" +
                sources.join("\n") +
                "\n\nCheck your network connection, or open the browser DevTools (F12) → Network tab to see what was blocked."
            );
            return;
          }
        }
      }

      // Wait a tick for Decap to register its CMS global.
      var tries = 0;
      function waitForCMS() {
        if (window.CMS) {
          if (window.__debugLog) window.__debugLog("CMS global detected", "ok");
          setStatus("Editor ready");
          // v3.14.4: stop trying to detect Decap's specific DOM
          // selectors (they change between Decap versions and we
          // were leaving the boot screen stuck on top of an
          // already-rendered Decap UI). Instead: just wait a
          // moment for Decap to mount, then remove the boot.
          // If Decap failed to render, the 20s failsafe below
          // will catch it.
          setTimeout(function () {
            var boot = document.getElementById("boot");
            if (boot) boot.remove();
            if (window.__debugLog) window.__debugLog("Boot screen removed", "info");
          }, 1500);
          // Failsafe: if Decap hasn't rendered after 20s, show a
          // diagnostic error instead of leaving the user on a blank page.
          setTimeout(function () {
            if (document.getElementById("boot")) {
              if (window.__debugLog) window.__debugLog("20s failsafe fired", "err");
              showError(
                "Decap loaded but the editor never appeared",
                "This usually means config.yml has an error. " +
                "Open the browser DevTools (F12) → Console tab and look for " +
                "a yellow or red error message — it'll point at the broken " +
                "field in config.yml."
              );
            }
          }, 20000);
        } else if (tries < 50) {
          tries++;
          setTimeout(waitForCMS, 100);
        } else {
          if (window.__debugLog) window.__debugLog("CMS global never appeared", "err");
          showError(
            "Decap loaded but CMS global is missing",
            "The script loaded but the global `CMS` object never appeared. " +
            "This is unusual — try a hard refresh (Ctrl+Shift+R or Cmd+Shift+R)."
          );
        }
      }
      waitForCMS();
    })();
  </script>
</body>
</html>
