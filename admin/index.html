<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Content Manager · Recalone</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%230b0b0d'/%3E%3Ctext x='50' y='68' font-family='sans-serif' font-size='60' font-weight='700' fill='%23E8A33D' text-anchor='middle'%3ER%3C/text%3E%3C/svg%3E" />
  <style>
    /* v3.14.4: !important on body bg so Decap's CSS can't
       flip us to its light theme. The boot screen stays
       dark no matter what Decap does to <body>. */
    html, body {
      background: #0b0b0d !important;
      color: #e8e8e8 !important;
      margin: 0 !important;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif !important;
    }
    .boot {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      flex-direction: column;
      gap: 1rem;
      padding: 2rem;
    }
    .boot__title {
      font-size: 1.1rem;
      color: #7a7a7e;
      letter-spacing: 0.04em;
    }
    .boot__progress {
      font-size: 0.85rem;
      color: #4a4a4e;
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, monospace;
    }
    .boot__error {
      max-width: 720px;
      padding: 1.5rem;
      background: #1c1c20;
      border: 1px solid #3a1f1f;
      border-left: 3px solid #f87171;
      border-radius: 8px;
      color: #e8e8e8;
    }
    .boot__error h2 {
      color: #f87171;
      font-size: 1rem;
      margin: 0 0 0.5rem 0;
    }
    .boot__error pre {
      background: #0b0b0d;
      padding: 0.75rem;
      border-radius: 4px;
      overflow-x: auto;
      font-size: 0.8rem;
      line-height: 1.5;
      color: #c8c8c8;
      white-space: pre-wrap;
    }
    .boot__hint {
      font-size: 0.8rem;
      color: #7a7a7e;
      line-height: 1.5;
      max-width: 720px;
    }
    .boot__hint code {
      background: #1c1c20;
      padding: 0.15rem 0.4rem;
      border-radius: 3px;
      color: #E8A33D;
    }
  </style>
</head>
<body>
  <!--
    Decap CMS admin panel. Loads the editor from a CDN, then auto-detects
    config.yml in this same directory and renders the editor UI.

    CDN order: jsDelivr first, unpkg as fallback. If both fail, we show
    a clear error message instead of a silent dark page.
  -->
  <div class="boot" id="boot">
    <p class="boot__title">Loading content manager…</p>
    <p class="boot__progress" id="boot-status">Loading Decap CMS from jsDelivr</p>
  </div>

  <script>
    // Show the loading state immediately, then track Decap's progress.
    window.addEventListener("error", function (event) {
      showError(
        "Page script error",
        (event.error && event.error.stack) || event.message || "Unknown error"
      );
    });

    function setStatus(text) {
      var el = document.getElementById("boot-status");
      if (el) el.textContent = text;
    }

    function showError(title, details) {
      var boot = document.getElementById("boot");
      if (!boot) return;
      boot.innerHTML =
        '<div class="boot__error">' +
          '<h2>' + title + '</h2>' +
          '<pre>' + escapeHtml(String(details)) + '</pre>' +
        '</div>' +
        '<p class="boot__hint">' +
          'Common causes: <br>' +
          '• Invalid <code>config.yml</code> (check browser console for parse errors) <br>' +
          '• CDN blocked (try a different network) <br>' +
          '• <code>base_url</code> in config.yml doesn\'t match the deployed Worker URL <br>' +
          'Open the browser DevTools (F12) → Console tab for the full error.' +
        '</p>';
    }

    function escapeHtml(s) {
      return s
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    // Try loading Decap from jsDelivr first.
    function loadDecap(url) {
      return new Promise(function (resolve, reject) {
        var script = document.createElement("script");
        script.src = url;
        script.async = false;
        script.onload = function () { resolve(url); };
        script.onerror = function () { reject(new Error("Failed to load: " + url)); };
        document.head.appendChild(script);
      });
    }

    (async function () {
      // Make sure unhandled errors hit our error UI.
      window.addEventListener("unhandledrejection", function (event) {
        showError("Unhandled error", (event.reason && event.reason.stack) || event.reason);
      });

      // v3.14.3: 3.7.4 was never published (Decap jumped 3.7.2 → 3.8.0
      // on npm). Bumped to 3.15.1 (latest stable as of 2026-08-05).
      // Version is pinned (not @latest) so a future breaking change
      // upstream can't silently break the admin.
      var version = "3.15.1";
      var sources = [
        "https://cdn.jsdelivr.net/npm/decap-cms@" + version + "/dist/decap-cms.js",
        "https://unpkg.com/decap-cms@" + version + "/dist/decap-cms.js",
      ];

      for (var i = 0; i < sources.length; i++) {
        try {
          setStatus("Loading Decap CMS (try " + (i + 1) + "/" + sources.length + ")…");
          await loadDecap(sources[i]);
          setStatus("Decap loaded, initializing editor…");
          break;
        } catch (err) {
          if (i === sources.length - 1) {
            showError(
              "Could not load Decap CMS",
              "Tried both CDNs and both failed:\n" +
                sources.join("\n") +
                "\n\nCheck your network connection, or open the browser DevTools (F12) → Network tab to see what was blocked."
            );
            return;
          }
        }
      }

      // Wait a tick for Decap to register its CMS global.
      var tries = 0;
      function waitForCMS() {
        if (window.CMS) {
          setStatus("Editor ready");
          // v3.14.4: stop trying to detect Decap's specific DOM
          // selectors (they change between Decap versions and we
          // were leaving the boot screen stuck on top of an
          // already-rendered Decap UI). Instead: just wait a
          // moment for Decap to mount, then remove the boot.
          // If Decap failed to render, the 20s failsafe below
          // will catch it.
          setTimeout(function () {
            var boot = document.getElementById("boot");
            if (boot) boot.remove();
          }, 1500);
          // Failsafe: if Decap hasn't rendered after 20s, show a
          // diagnostic error instead of leaving the user on a blank page.
          setTimeout(function () {
            if (document.getElementById("boot")) {
              showError(
                "Decap loaded but the editor never appeared",
                "This usually means config.yml has an error. " +
                "Open the browser DevTools (F12) → Console tab and look for " +
                "a yellow or red error message — it'll point at the broken " +
                "field in config.yml."
              );
            }
          }, 20000);
        } else if (tries < 50) {
          tries++;
          setTimeout(waitForCMS, 100);
        } else {
          showError(
            "Decap loaded but CMS global is missing",
            "The script loaded but the global `CMS` object never appeared. " +
            "This is unusual — try a hard refresh (Ctrl+Shift+R or Cmd+Shift+R)."
          );
        }
      }
      waitForCMS();
    })();
  </script>

  <!--
    v3.14.24: stripped-down localStorage draft layer.

    Tarek's feedback on v3.14.20-23: too much. Auto-save on every
    keystroke felt like a "screenshot every second". Toasts, draft
    counts, the orange "Publish all (N)" with the big N — all
    unnecessary noise for a small admin. The Publish flow walked
    drafts one-by-one and reported each; he just wanted the button
    to work and shut up.

    What it does now, in three sentences:

      1. Click Save -> form state is written to localStorage under
         `decap-draft:<collection>:<entryId>`. Nothing else
         happens. No toast, no count, no console log.

      2. The "Publish" button next to Save walks every localStorage
         draft, navigates to that entry, fills the form, clicks
         Decap's real Save (which commits to the editorial workflow
         draft branch), and removes the draft from localStorage.
         Silent. If a save fails the draft stays so the next click
         retries it.

      3. Navigating between entries (or refreshing) restores the
         draft into the form so work-in-progress isn't lost.

    That's it. No auto-save, no toasts, no draft count, no
    MutationObserver, no console logs.
  -->
  <script>
  (function () {
    "use strict";

    var LS = "decap-draft:";
    var PUBLISH_BTN_ID = "decap-publish";
    var publishInProgress = false;
    var lastHash = "";

    // Parse the URL hash to get {collection, entryId}.
    // new entries have no entryId in the URL, so we make one up.
    function ctx() {
      var m = window.location.hash.match(
        /#\/collections\/([^/]+)\/(?:new|entries\/([^/?]+))/
      );
      if (!m) return null;
      return { collection: m[1], entryId: m[2] || ("new-" + Date.now()) };
    }
    function lsKey(c, id) { return LS + c + ":" + id; }

    // Read every named input on the page as a flat {name: value}
    // object. Decap's entry editor has its inputs scattered across
    // a React-rendered tree (no <form> wrapper), so we just grab
    // everything with a name attribute.
    function readForm() {
      var ins = document.querySelectorAll("input[name], textarea[name], select[name]");
      if (!ins.length) return null;
      var data = {};
      for (var i = 0; i < ins.length; i++) {
        var el = ins[i], k = el.name;
        if (!k) continue;
        if (el.type === "checkbox") data[k] = el.checked;
        else if (el.type === "radio") { if (el.checked) data[k] = el.value; }
        else data[k] = el.value;
      }
      return data;
    }
    function writeForm(data) {
      if (!data) return;
      var ins = document.querySelectorAll("input[name], textarea[name], select[name]");
      for (var i = 0; i < ins.length; i++) {
        var el = ins[i], k = el.name;
        if (!k || !(k in data)) continue;
        var v = data[k];
        if (el.type === "checkbox") el.checked = !!v;
        else if (el.type === "radio") el.checked = (el.value === v);
        else el.value = v;
        el.dispatchEvent(new Event("input", { bubbles: true }));
        el.dispatchEvent(new Event("change", { bubbles: true }));
      }
    }

    // Save click -> write current form to localStorage. Done.
    // The listener is on document (capture) so it survives
    // Decap's form re-renders. publishInProgress flag lets the
    // Publish flow click the real Save without being intercepted.
    document.addEventListener("click", function (e) {
      if (publishInProgress) return;
      var btn = e.target.closest && e.target.closest("button");
      if (!btn) return;
      if ((btn.textContent || "").trim().indexOf("Save") !== 0) return;
      var c = ctx();
      if (!c) return;
      var data = readForm();
      if (!data) return;
      e.preventDefault();
      e.stopImmediatePropagation();
      try { localStorage.setItem(lsKey(c.collection, c.entryId), JSON.stringify(data)); } catch (_) {}
    }, true);

    // Restore the draft for the current entry, if any.
    function restore() {
      var c = ctx();
      if (!c) return;
      var raw = localStorage.getItem(lsKey(c.collection, c.entryId));
      if (!raw) return;
      try { writeForm(JSON.parse(raw)); } catch (_) {}
    }

    // Find Decap's Save button (text starts with "Save").
    function findSave() {
      var bs = document.querySelectorAll("button");
      for (var i = 0; i < bs.length; i++) {
        if ((bs[i].textContent || "").trim().indexOf("Save") === 0) return bs[i];
      }
      return null;
    }

    // Add the "Publish" button next to Save. Re-tried periodically
    // because Decap re-renders the toolbar on navigation.
    function addPublish() {
      if (document.getElementById(PUBLISH_BTN_ID)) return;
      var save = findSave();
      if (!save || !save.parentElement) return;
      var btn = document.createElement("button");
      btn.id = PUBLISH_BTN_ID;
      btn.type = "button";
      btn.textContent = "Publish";
      btn.style.cssText = "margin-left:8px;";
      btn.addEventListener("click", function (e) {
        e.preventDefault();
        e.stopPropagation();
        publishAll();
      });
      save.parentElement.appendChild(btn);
    }

    // Walk every localStorage draft, navigate to that entry,
    // fill the form, click Decap's real Save (with override
    // bypassed), wait for navigation back to the list (= save
    // succeeded), then clear the draft. Silent.
    function publishAll() {
      var drafts = [];
      for (var i = 0; i < localStorage.length; i++) {
        var k = localStorage.key(i);
        if (k && k.indexOf(LS) === 0) {
          try { drafts.push({ key: k, data: JSON.parse(localStorage.getItem(k)) }); }
          catch (_) {}
        }
      }
      if (!drafts.length) return;
      var i = 0;
      function next() {
        if (i >= drafts.length) { publishInProgress = false; return; }
        var d = drafts[i++];
        var p = d.key.slice(LS.length).split(":");
        var col = p[0], id = p.slice(1).join(":");
        var hash = id.indexOf("new-") === 0
          ? "#/collections/" + col + "/new"
          : "#/collections/" + col + "/entries/" + encodeURIComponent(id);
        if (window.location.hash !== hash) window.location.hash = hash;
        waitFor(10000, function () {
          return document.querySelectorAll("input[name]").length > 0;
        }).then(function () {
          writeForm(d.data);
          return wait(300);
        }).then(function () {
          var save = findSave();
          if (!save) throw new Error("no save");
          publishInProgress = true;
          save.click();
          return waitFor(15000, function () {
            return !/#\/collections\/[^/]+\/(new|entries\/)/.test(window.location.hash);
          });
        }).then(function () {
          localStorage.removeItem(d.key);
          setTimeout(next, 400);
        }).catch(function () {
          setTimeout(next, 200);
        });
      }
      next();
    }

    // Poll for URL changes (Decap uses hash routing) so we can
    // restore drafts on navigation. Also re-add the Publish
    // button after each render.
    setInterval(function () {
      addPublish();
      if (window.location.hash !== lastHash) {
        lastHash = window.location.hash;
        setTimeout(restore, 200);
      }
    }, 400);

    // Suppress Decap's beforeunload prompt. Changes are in
    // localStorage; the user doesn't need a warning.
    window.addEventListener("beforeunload", function (e) {
      e.preventDefault();
      e.returnValue = "";
      return undefined;
    });

    function wait(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
    function waitFor(ms, pred) {
      return new Promise(function (resolve, reject) {
        var t0 = Date.now();
        (function tick() {
          if (pred()) return resolve();
          if (Date.now() - t0 > ms) return reject();
          setTimeout(tick, 80);
        })();
      });
    }

    setTimeout(restore, 200);
    setTimeout(addPublish, 200);
  })();
  </script>
</body>
