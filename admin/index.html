<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Gestor de contenido · Recalone</title>
  <link rel="icon" href="/assets/images/favicon.svg" type="image/svg+xml" />
  <style>
    body { margin: 0; min-height: 100vh; background: #0b0b0d; color: #e8e8e8; font-family: system-ui, sans-serif; }
    #loading { padding: 2rem; text-align: center; }
  </style>
</head>
<body>
  <p id="loading">Cargando gestor de contenido…</p>
  <script>
    window.addEventListener("load", () => {
      if (!window.CMS) document.getElementById("loading").textContent = "No se pudo cargar Decap CMS. Comprueba la conexión e inténtalo de nuevo.";
      else document.getElementById("loading").remove();
    });
  </script>
  <script src="https://cdn.jsdelivr.net/npm/decap-cms@3.15.1/dist/decap-cms.js"></script>
</body>
</html>
