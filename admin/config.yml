backend:
  name: github
  repo: rubereco/cinema-lighttech-portfolio
  branch: main
  base_url: https://oauth.recalone.com
  auth_endpoint: auth
  open_authoring: false
  squash_merges: true

locale: es
site_url: https://recalone.com
display_url: https://recalone.com
logo_url: /assets/images/og-image.svg
media_folder: assets/images/uploads
public_folder: /assets/images/uploads
publish_mode: editorial_workflow

collections:
  - name: films
    label: Películas
    label_singular: Película
    folder: data/films
    extension: json
    format: json
    create: true
    delete: true
    identifier_field: id
    slug: '{{fields.id}}'
    fields:
      - { name: id, label: 'ID (título-año)', widget: string, pattern: ['^[a-z0-9]+(?:-[a-z0-9]+)*$', 'Usa minúsculas, números y guiones.'], hint: 'Ejemplo: nueva-pelicula-2026. No cambies el ID después de crear la ficha.' }
      - { name: title, label: Título, widget: string }
      - { name: year, label: Año, widget: number, value_type: int, min: 1950, max: 2100 }
      - name: type
        label: Tipo
        widget: select
        options:
          - { label: Largometraje, value: feature }
          - { label: Serie, value: series }
          - { label: Cortometraje, value: short }
          - { label: Anuncio, value: ad }
          - { label: Videoclip, value: video }
          - { label: Otro, value: other }
      - name: role
        label: Rol de Tarek
        widget: select
        options:
          - { label: Gaffer, value: gaffer }
          - { label: Eléctrico, value: electrician }
          - { label: 'Eléctrico / 2º gaffer', value: electrician2nd }
          - { label: 'Eléctrico (dailies)', value: electricianDailies }
          - { label: 'Técnico de iluminación / Best Boy', value: lightingBestboy }
          - { label: Grip, value: grip }
      - { name: poster, label: Póster, widget: image, required: false, allow_external_urls: false }
      - { name: displayOrder, label: 'Orden en Trabajo seleccionado', widget: number, value_type: int, min: 1, required: false, hint: 'Un número distinto para cada película. Déjalo vacío para ocultarla del carrusel.' }
      - { name: trailerUrl, label: 'URL del tráiler', widget: string, required: false, hint: 'YouTube y Vimeo se reproducen aquí; RTVE, IMDb y otros enlaces se abren en su web.' }

  - name: people
    label: Personas
    label_singular: Persona
    folder: data/people
    extension: json
    format: json
    create: true
    delete: true
    identifier_field: id
    slug: '{{fields.id}}'
    fields:
      - { name: id, label: ID, widget: string, pattern: ['^[a-z0-9]+(?:-[a-z0-9]+)*$', 'Usa minúsculas, números y guiones.'], hint: 'No cambies el ID después de crear la ficha.' }
      - { name: name, label: Nombre, widget: string }
      - { name: portrait, label: Retrato, widget: image, required: false, allow_external_urls: false }
      - { name: url, label: Enlace, widget: string, required: false }
      - name: partnership
        label: Colaboración habitual
        widget: object
        required: false
        fields:
          - name: categories
            label: Secciones
            widget: select
            multiple: true
            options:
              - { label: Dirección, value: direction }
              - { label: Fotografía, value: cinematography }
              - { label: Iluminación, value: lighting }
              - { label: Sonido, value: sound }
              - { label: Producción, value: production }
              - { label: Otros, value: other }
          - { name: since, label: 'Colabora desde', widget: number, value_type: int, required: false }

  - name: companies
    label: Empresas
    files:
      - name: companies-data
        label: Empresas
        file: data/companies.json
        format: json
        fields:
          - name: companies
            label: Empresas
            widget: list
            summary: '{{fields.name}}'
            fields:
              - { name: id, label: ID, widget: string }
              - { name: name, label: Nombre, widget: string }
              - { name: kind, label: Tipo, widget: string }
              - { name: logo, label: Logo, widget: image, required: false, allow_external_urls: false }
              - { name: url, label: URL, widget: string, required: false }

  - name: site
    label: Sitio
    files:
      - name: site-data
        label: Contacto y marca
        file: data/site.json
        format: json
        fields:
          - name: contact
            label: Contacto
            widget: object
            fields:
              - { name: email, label: Email, widget: string }
              - { name: imdbUrl, label: 'URL de IMDb', widget: string, required: false }
              - { name: instagram, label: Instagram, widget: string, required: false }
              - { name: instagramUrl, label: 'URL de Instagram', widget: string, required: false }

  - name: hero
    label: 'Hero carrusel'
    files:
      - name: hero-data
        label: Imágenes del hero
        file: data/hero.json
        format: json
        fields:
          - name: items
            label: Imágenes
            widget: list
            summary: '{{fields.id}} — {{fields.size}}'
            fields:
              - { name: id, label: 'ID para traducciones', widget: string }
              - { name: file, label: Imagen, widget: image, allow_external_urls: false }
              - { name: size, label: Tamaño, widget: select, options: [big, small] }

  - name: i18n
    label: Traducciones
    files:
      - name: translations
        label: 'Textos del sitio en inglés y español'
        file: data/i18n.json
        format: json
        fields:
          - name: entries
            label: 'Abre un texto para editarlo'
            widget: list
            collapsed: true
            allow_add: false
            allow_remove: false
            allow_reorder: false
            summary: '{{fields.editorLabel}}'
            fields:
              - { name: key, label: 'Clave interna', widget: hidden }
              - { name: editorLabel, label: 'Nombre interno', widget: hidden }
              - { name: en, label: 'Texto en inglés', widget: text, hint: 'Si aparecen etiquetas o palabras entre llaves, consérvalas al cambiar el texto.' }
              - { name: es, label: 'Texto en español', widget: text, hint: 'Si aparecen etiquetas o palabras entre llaves, consérvalas al cambiar el texto.' }
