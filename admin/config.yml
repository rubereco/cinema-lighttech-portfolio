# ════════════════════════════════════════════════════════════════════════
# Configuración de Decap CMS para el portfolio de Tarek Recolons
# ════════════════════════════════════════════════════════════════════════
#
# Este archivo controla lo que se puede editar desde el panel de admin en /admin. El
# esquema es pequeño a propósito para la Fase 1: películas, orden de trabajo,
# personas, empresas, traducciones. La configuración global del sitio (colores de marca,
# temas, etc.) se queda como código por ahora.
#
# Auth:
#   backend: github  — commits to this repo
#   open_authoring: false — only authorized GitHub users can edit
#   The OAuth handshake is brokered by a Cloudflare Worker (see
#   cloudflare-worker/oauth-proxy.js). The worker's URL is the
#   `base_url` here, and Decap appends /auth and /callback.
#
# Where uploaded media files go. v3.14.27: consolidated all 15
# user-editable images into this single folder. Decap's github
# backend doesn't support media_folders (plural) at runtime —
# its getMedia() only reads config.media_folder (singular) and
# lists files in that one path via the GitHub contents API.
# No recursion, no aggregation. So the picker would always
# show "No assets found" if images live in different folders.
# All editable images are flat in assets/images/uploads/ now.
# (Tarek or rubereco can rename the folder later if needed.)
#
# v3.14.5: switched from the legacy `file:` (singular) pattern to
# the modern `files:` (plural) pattern. Decap 3.15.1's JSON schema
# validator rejects `file:` — each collection must have either
# `files:` (a list of file definitions) or `folder:` (a folder
# of files). For our case (one file per collection), each entry
# in `files:` is a single-item list with one file definition.

backend:
  name: github
  repo: rubereco/cinema-lighttech-portfolio
  branch: wip/portfolio-r1
  # base_url is the Cloudflare Worker URL. After deploying the
  # oauth-proxy worker, set this to the worker's URL (e.g. the
  # *.workers.dev default or a custom domain like oauth.recalone.com).
  base_url: https://oauth.recalone.com
  auth_endpoint: auth
  open_authoring: false
  squash_merges: true

# v3.14.28: locale: es makes Decap's built-in UI
# strings come up in Spanish (Save → Guardar, Delete → Eliminar,
# View Live → Ver en vivo, workflow labels, etc.). The schema
# labels below are translated by hand because Decap's i18n
# only covers built-in strings, not user-defined field labels.
locale: es

# URL del sitio — la usa Decap para los botones de "Vista previa".
site_url: https://recalone.com
display_url: https://recalone.com
logo_url: /assets/images/og-image.svg

# Where uploaded media files go. All Decap uploads land here.
# Phase 1: Tarek or rubereco can move them to the right subfolder
# (e.g. assets/images/partners/ for company logos) after upload.
# v3.14.27: consolidated all 15 user-editable images into
# assets/images/uploads/. Decap's github backend doesn't
# support media_folders (plural) at runtime — its
# implementation of getMedia() in api.ts only reads
# config.media_folder (singular) and lists files in that
# one path via the GitHub contents API. No recursion, no
# aggregation. So even though the config schema and core
# code accept media_folders, the github backend ignores
# it. The picker showed "No assets found" because the
# singular media_folder points at uploads/ (empty), not
# at partners/ or projects/ where the actual images live.
# Fix: move all editable images to assets/images/uploads/,
# update the data paths + production code, drop the plural
# form. Now the media library sees all 15 images.
media_folder: "assets/images/uploads"
public_folder: "/assets/images/uploads"

# v3.14.12: enabled editorial workflow. Without this, every save
# directly commits to wip/portfolio-r1, which triggers one
# Cloudflare build per save. If Tarek is editing three collections
# (add a film, add it to work order, add the director to people),
# he'd wait for 3 separate Cloudflare deploys.
#
# With editorial_workflow, all saves go into a "draft" state on a
# separate branch (cms/editorial-workflow). When Tarek is ready,
# he clicks Publish once → Decap opens (or adds to) a single PR
# to wip/portfolio-r1. One merge = one Cloudflare build. The
# workflow tab in the UI shows all current drafts.
#
# Trade-off: Tarek (or rubereco) needs to merge the PR in
# GitHub. If branch protection allows auto-merge on
# wip/portfolio-r1, no manual step is needed.
publish_mode: editorial_workflow

# ─── Collections ──────────────────────────────────────────────────────

collections:
  # 1) Films — canonical film records. Adding a film here makes it
  #    available to be referenced by the Work collection below.
  #    v3.14.16: folder-based collection (one file per film in
  #    data/films/<id>.json). Folder collections work reliably with
  #    the relation widget — file collections with a nested list
  #    don't (the relation index comes back empty). A tiny build
  #    step (scripts/build.js) regenerates the legacy data/films.json
  #    aggregate that the production site reads.
  - name: "films"
    label: "Películas"
    label_singular: "Película"
    description: "Registros canónicos de películas (título, año, rol, tipo, créditos)."
    folder: "data/films"
    extension: "json"
    format: "json"
    create: true
    delete: true
    slug: "{{id}}"
    fields:
      - { name: "id",    label: "ID (kebab-case-título-año)", widget: "string", hint: "ej. els-mals-noms-2025" }
      - { name: "title", label: "Título",  widget: "string" }
      - { name: "year",  label: "Año",    widget: "number", value_type: "int", min: 1950, max: 2100 }
      # v3.14.25: image widget. The field already exists in 10 of
      # 12 film data files and is read by main.js for the
      # homepage poster wall and film modal. It just wasn't in
      # the Decap schema before, so Tarek couldn't edit it from
      # the admin. Now he can browse the existing posters in
      # assets/images/uploads/ or upload a new one. Two films
      # (el-cuco-2023, saw-2026) have no poster yet — the
      # production code skips films without one.
      # v3.14.27: poster files moved from
      # assets/projects/<id>/poster.jpg to
      # assets/images/uploads/<id>.jpg (consolidated into the
      # single media folder).
      - name: "poster"
        label: "Póster"
        widget: "image"
        required: false
        allow_external_urls: false
        hint: "Haz clic para explorar la biblioteca de medios. Los pósteres existentes están en assets/images/uploads/."
      - { name: "role",  label: "Rol de Tarek en esta película", widget: "string", hint: "ej. Gaffer, Best Boy Electric, Eléctrico" }
      - name: "type"
        label: "Tipo"
        widget: "select"
        options:
          - { label: "Largometraje", value: "Largometraje" }
          - { label: "Serie TV",              value: "Serie TV" }
          - { label: "Cortometraje",          value: "Cortometraje" }
          - { label: "Comercial",            value: "Comercial" }
          - { label: "Otro",                 value: "Otro" }
      - name: "people"
        label: "Personas en esta película"
        widget: "list"
        # v3.14.18: credits.people now references the Jobs
        # collection (data/jobs/) by jobId — a normalized
        # relationship, no free-text role strings. The dropdown
        # shows job name (i18n) so Tarek picks "Director of
        # Photography" not "dop" or "DoP" or "DP". The
        # description is per-credit i18n for the film detail
        # page.
        summary: "{{fields.jobId}} — {{fields.personId}}"
        fields:
          - name: "personId"
            label: "Persona"
            widget: "relation"
            collection: "people"
            searchFields: ["name"]
            valueField: "id"
            displayFields: ["name"]
          - name: "jobId"
            label: "Trabajo / rol en esta película"
            widget: "relation"
            collection: "jobs"
            searchFields: ["name.en", "name.es", "id"]
            valueField: "id"
            displayFields: ["name.en", "category"]
          - name: "description"
            label: "Descripción (por crédito, opcional)"
            widget: "object"
            collapsed: true
            required: false
            fields:
              - { name: "en", label: "Inglés",  widget: "text", required: false }
              - { name: "es", label: "Español", widget: "text", required: false }

  # 2) Jobs — the catalog of possible roles. One file per job in
  #    data/jobs/<id>.json. v3.14.18: new normalized table so the
  #    person is just a collaborator (no role on them), and the
  #    role on a credit references a job here. Adding a new role
  #    is just adding a file here — no schema change.
  - name: "jobs"
    label: "Trabajos / roles"
    label_singular: "Trabajo"
    description: "Catálogo de roles. Cada crédito de película referencia uno de estos por id."
    folder: "data/jobs"
    extension: "json"
    format: "json"
    create: true
    delete: true
    slug: "{{id}}"
    fields:
      - { name: "id", label: "ID (kebab-case)", widget: "string", hint: "ej. gaffer, dop, sparks" }
      - name: "name"
        label: "Nombre (i18n)"
        widget: "object"
        fields:
          - { name: "en", label: "Inglés",  widget: "string" }
          - { name: "es", label: "Español", widget: "string" }
      - name: "category"
        label: "Categoría de departamento"
        widget: "select"
        options:
          - { label: "Dirección",       value: "direction" }
          - { label: "Cinematografía",  value: "cinematography" }
          - { label: "Iluminación",     value: "lighting" }
          - { label: "Sonido",          value: "sound" }
          - { label: "Producción",      value: "production" }
          - { label: "Other",           value: "other" }
        hint: "Determina en qué sección aparece el trabajo (y cualquier persona que colabore en él) en la página de colaboradores. Un 'gaffer' es iluminación, un 'dop' es cinematografía, etc."

  # 3) Work — the ordered list of films shown on the homepage. Each
  #    row references a film by id. Reorder via drag-and-drop in the UI.
  - name: "work"
    label: "Orden de trabajo"
    label_singular: "Fila de trabajo"
    description: "Lista ordenada de películas mostradas en la tabla de créditos de la página principal."
    files:
      - name: "work-data"
        label: "Filas de trabajo"
        file: "data/work.json"
        format: "json"
        fields:
          - name: "rows"
            label: "Películas en orden de visualización"
            widget: "list"
            summary: "→ {{fields.filmId}}"
            fields:
              - name: "filmId"
                label: "Película"
                # v3.14.13: relation widget so the user picks
                # from a searchable dropdown of all films in the
                # Films collection. Search by title, year, or id;
                # dropdown shows title + year. Selected entry's id
                # is stored — matches the existing data shape
                # ({ filmId: "..." } per row).
                widget: "relation"
                collection: "films"
                searchFields: ["title", "year", "id"]
                valueField: "id"
                displayFields: ["title", "year"]

  # 3) People — all people entries. Some are film credits (kind: director,
  #    dop, gaffer, electric), some are partners (relationship: dp | electric).
  #    v3.14.16: folder-based collection. See films comment for the
  #    rationale. One file per person in data/people/<id>.json.
  - name: "people"
    label: "Personas"
    label_singular: "Persona"
    description: "Directores, DPs, gaffers, eléctricos y colaboradores habituales."
    folder: "data/people"
    extension: "json"
    format: "json"
    create: true
    delete: true
    slug: "{{id}}"
    fields:
      - { name: "id",   label: "ID (kebab-case)",  widget: "string", hint: "ej. juli-carne-martorell" }
      - { name: "name", label: "Nombre",            widget: "string" }
      # v3.14.18: stripped the 'kind' and 'relationship' and 'works'
      # fields. A person is just a collaborator — the role they
      # played on a specific film lives on that film's credit (as
      # a jobId reference to the Jobs collection). The only role-
      # adjacent field on the person is 'partnership', which is a
      # RELATIONSHIP (not a role) listing which jobs this person
      # partners with Tarek in for the partners page.
      - name: "partnership"
        label: "Colaboración (opcional — solo para colaboradores habituales)"
        widget: "object"
        collapsed: true
        required: false
        hint: "Déjalo vacío para créditos puntuales. Configúralo para que la persona aparezca en la página de colaboradores en la(s) sección(es) de su(s) jobId(s)."
        fields:
          - name: "jobIds"
            label: "Trabajos en los que colabora"
            widget: "list"
            field:
              name: "jobId"
              label: "Trabajo"
              widget: "relation"
              collection: "jobs"
              searchFields: ["name.en", "name.es", "id"]
              valueField: "id"
              displayFields: ["name.en", "category"]
            hint: "Los trabajos en los que esta persona colabora habitualmente con Tarek. Una persona puede colaborar en varios trabajos (ej. dop + director). La página de colaboradores la muestra en la sección de cada trabajo según su categoría."
          - { name: "since",     label: "Colabora desde (año)",   widget: "number", value_type: "int", required: false }
          - name: "description"
            label: "Nota de colaboración (i18n, opcional)"
            widget: "object"
            collapsed: true
            required: false
            fields:
              - { name: "en", label: "Inglés",  widget: "text", required: false }
              - { name: "es", label: "Español", widget: "text", required: false }
      # v3.14.25: image widget instead of string. Clicking the
      # field opens the media library popup — browse / preview /
      # pick from existing portraits in assets/images/uploads/
      # or upload a new one. Stores the path as a string under
      # the hood, so no data migration needed.
      # v3.14.27: portrait files moved from
      # assets/images/partners/ to assets/images/uploads/
      # (consolidated into the single media folder).
      - name: "portrait"
        label: "Retrato"
        widget: "image"
        required: false
        allow_external_urls: false
        hint: "Haz clic para explorar la biblioteca de medios. Los retratos existentes están en assets/images/uploads/."
      - { name: "imdb",      label: "ID de IMDb",     widget: "string", required: false }
      - { name: "imdbUrl",   label: "URL de IMDb",   widget: "string", required: false }
      - { name: "instagram", label: "Usuario de Instagram", widget: "string", required: false }
      - { name: "instagramUrl", label: "URL de Instagram",  widget: "string", required: false }
      - name: "description"
        label: "Bio (i18n)"
        widget: "object"
        collapsed: true
        required: false
        hint: "Bio en texto libre. El portfolio estructurado (en qué películas trabajó, en qué rol) NO está aquí — se deriva de los créditos de las películas, sin duplicación."
        fields:
          - { name: "en", label: "Inglés",  widget: "text", required: false }
          - { name: "es", label: "Español", widget: "text", required: false }
      - { name: "url",      label: "URL del sitio web",  widget: "string", required: false }
      - { name: "urlLabel", label: "Etiqueta de URL",   widget: "string", required: false, hint: "ej. 'Portfolio', 'Sitio web'" }

  # 4) Companies — partner businesses (equipment houses, post houses,
  #    any other non-individual partner).
  - name: "companies"
    label: "Empresas"
    label_singular: "Empresa"
    description: "Casas de equipo, postproducción y otros negocios colaboradores."
    files:
      - name: "companies-data"
        label: "Empresas"
        file: "data/companies.json"
        format: "json"
        fields:
          - name: "companies"
            label: "Empresas"
            widget: "list"
            summary: "{{fields.name}} ({{fields.kind}})"
            fields:
              - { name: "id",   label: "ID (kebab-case)", widget: "string", hint: "ej. movie-men" }
              - { name: "name", label: "Nombre",           widget: "string" }
              - name: "kind"
                label: "Tipo"
                widget: "select"
                options:
                  - { label: "Casa de equipo",    value: "equipment-house" }
                  - { label: "Postproducción",   value: "post-house" }
                  - { label: "Estudio de sonido", value: "sound-studio" }
                  - { label: "Otro colaborador", value: "other" }
              # v3.14.25: image widget so the company logo gets
              # the same media-library popup as people.portrait.
              # v3.14.27: logo files moved from
              # assets/images/partners/ to assets/images/uploads/
              # (consolidated into the single media folder).
              - name: "logo"
                label: "Logo"
                widget: "image"
                allow_external_urls: false
                hint: "Haz clic para explorar la biblioteca de medios. Los logos existentes están en assets/images/uploads/."
              - { name: "logoAlt", label: "Texto alternativo del logo", widget: "string", required: false }
              - { name: "count",   label: "Número de colaboraciones (oculto si es 0)", widget: "number", value_type: "int", default: 0, required: false }
              - name: "description"
                label: "Descripción"
                widget: "object"
                collapsed: true
                required: false
                fields:
                  - { name: "en", label: "Inglés",  widget: "text", required: false }
                  - { name: "es", label: "Español", widget: "text", required: false }
              - { name: "url",      label: "URL del sitio web", widget: "string", required: false }
              - { name: "urlLabel", label: "Etiqueta de URL",  widget: "string", required: false }

  # 5) Site config — single object. Brand name, contact, stats.
  - name: "site"
    label: "Configuración del sitio"
    label_singular: "Sitio"
    description: "Nombre de marca, información de contacto, estadísticas mostradas en la página principal."
    files:
      - name: "site-data"
        label: "Sitio"
        file: "data/site.json"
        format: "json"
        fields:
          - { name: "brand", label: "Nombre de marca", widget: "string" }
          - name: "contact"
            label: "Contacto"
            widget: "object"
            fields:
              - { name: "email",       label: "Email",            widget: "string" }
              - { name: "imdbId",      label: "ID de IMDb",       widget: "string", required: false }
              - { name: "imdbUrl",     label: "URL de IMDb",      widget: "string", required: false }
              - { name: "instagram",   label: "Usuario de Instagram", widget: "string", required: false }
              - { name: "instagramUrl", label: "URL de Instagram",   widget: "string", required: false }
          - name: "stats"
            label: "Estadísticas (mostradas en la sección Sobre mí)"
            widget: "object"
            fields:
              - { name: "yearsExperience", label: "Años de experiencia", widget: "number", value_type: "int" }
              - { name: "featureFilms",    label: "Largometrajes",        widget: "number", value_type: "int" }
              - { name: "availability",    label: "Disponibilidad",         widget: "string", hint: "ej. 'España + internacional'" }

  # 6) Translations — DEFERRED for Phase 1. The data file is too
  #    deeply nested to expose via the `object` widget without
  #    defining every leaf string. The `code` widget only works on
  #    string values, but en/es are objects, so it errors out.
  #    For now, edit data/i18n.json directly via git. Phase 2
  #    will add a structured editor with a full schema for nav,
  #    hero, work, about, partners, footer, etc.
  #
  # When ready to re-enable, replace this block with:
  #   - name: "i18n"
  #     label: "Translations"
  #     files:
  #       - name: "i18n-data"
  #         label: "Translations"
  #         file: "data/i18n.json"
  #         format: "json"
  #         fields:
  #           - { name: "en", label: "Inglés",  widget: "object", fields: [ /* esquema completo: nav, hero, work... */ ] }
  #           - { name: "es", label: "Español", widget: "object", fields: [ /* el mismo */ ] }

  # 7) Hero carousel — the images that scroll across the homepage
  #    hero. v3.14.29: was hardcoded as <image> elements inside
  #    the SVG in index.html; now driven by data/hero.json, editable
  #    from this admin. The production code (assets/js/hero-carousel.js)
  #    reads the data via the inline tarek-hero JSON block and
  #    injects <image> elements into the SVG.
  #
  #    Each item is one tile: a file (image widget), a size
  #    (big = 500×500, small = 200×200) and an optional alt text.
  #    The list order = display order. Drag to reorder in the UI.
  #    Add/remove tiles freely — the carousel just wraps whatever
  #    you give it.
  - name: "hero"
    label: "Hero carrusel"
    label_singular: "Imagen del hero"
    description: "Imágenes que se desplazan por el hero de la página principal. Mezcla grandes (500×500) y pequeñas (200×200) para variedad visual."
    files:
      - name: "hero-data"
        label: "Imágenes del hero"
        file: "data/hero.json"
        format: "json"
        fields:
          - name: "items"
            label: "Imágenes"
            widget: "list"
            summary: "{{fields.size}} — {{fields.file}}"
            fields:
              - name: "file"
                label: "Imagen"
                widget: "image"
                allow_external_urls: false
                hint: "Haz clic para explorar la biblioteca de medios. Las imágenes del hero viven en assets/images/uploads/."
              - name: "size"
                label: "Tamaño"
                widget: "select"
                options:
                  - { label: "Grande (500×500)", value: "big" }
                  - { label: "Pequeña (200×200)", value: "small" }
                hint: "Grande = 500×500, pequeña = 200×200. El carrusel las alterna para variedad visual — una mezcla de ambas se ve mejor que un solo tamaño."
              - name: "alt"
                label: "Texto alternativo (accesibilidad, opcional)"
                widget: "string"
                required: false
