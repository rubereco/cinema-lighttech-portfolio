# ════════════════════════════════════════════════════════════════════════
# Decap CMS config for Tarek Recolons portfolio
# ════════════════════════════════════════════════════════════════════════
#
# This file controls what the admin panel at /admin can edit. The
# schema is intentionally small for Phase 1: films, work-order,
# people, companies, translations. Site-wide config (brand colors,
# themes, etc.) stays as code for now.
#
# Auth:
#   backend: github  — commits to this repo
#   open_authoring: false — only authorized GitHub users can edit
#   The OAuth handshake is brokered by a Cloudflare Worker (see
#   cloudflare-worker/oauth-proxy.js). The worker's URL is the
#   `base_url` here, and Decap appends /auth and /callback.
#
# Media:
#   media_folders: assets/images/uploads, assets/images/partners,
#                  assets/projects
#   public_folders: /assets/images/uploads, /assets/images/partners,
#                   /assets/projects
#   v3.14.25: switched from media_folder (singular) to media_folders
#   (plural). Previously the media library only scanned
#   assets/images/uploads, so the existing 5 partner logos in
#   assets/images/partners/ and 10 film posters in assets/projects/
#   were invisible. Tarek reported "i can't see the images on the
#   media menu". Adding all three folders (same order for
#   public_folders) makes them browsable. The image widget on
#   people.portrait / companies.logo / films.poster now opens a
#   picker showing all of them.
#
# v3.14.5: switched from the legacy `file:` (singular) pattern to
# the modern `files:` (plural) pattern. Decap 3.15.1's JSON schema
# validator rejects `file:` — each collection must have either
# `files:` (a list of file definitions) or `folder:` (a folder
# of files). For our case (one file per collection), each entry
# in `files:` is a single-item list with one file definition.

backend:
  name: github
  repo: rubereco/cinema-lighttech-portfolio
  branch: wip/portfolio-r1
  # base_url is the Cloudflare Worker URL. After deploying the
  # oauth-proxy worker, set this to the worker's URL (e.g. the
  # *.workers.dev default or a custom domain like oauth.recalone.com).
  base_url: https://oauth.recalone.com
  auth_endpoint: auth
  open_authoring: false
  squash_merges: true

# Site URL — used by Decap for "Preview" buttons.
site_url: https://recalone.com
display_url: https://recalone.com
logo_url: /assets/images/og-image.svg

# Where uploaded media files go. All Decap uploads land here.
# Phase 1: Tarek or rubereco can move them to the right subfolder
# (e.g. assets/images/partners/ for company logos) after upload.
media_folders:
  - "assets/images/uploads"
  - "assets/images/partners"
  - "assets/projects"
public_folders:
  - "/assets/images/uploads"
  - "/assets/images/partners"
  - "/assets/projects"

# v3.14.12: enabled editorial workflow. Without this, every save
# directly commits to wip/portfolio-r1, which triggers one
# Cloudflare build per save. If Tarek is editing three collections
# (add a film, add it to work order, add the director to people),
# he'd wait for 3 separate Cloudflare deploys.
#
# With editorial_workflow, all saves go into a "draft" state on a
# separate branch (cms/editorial-workflow). When Tarek is ready,
# he clicks Publish once → Decap opens (or adds to) a single PR
# to wip/portfolio-r1. One merge = one Cloudflare build. The
# workflow tab in the UI shows all current drafts.
#
# Trade-off: Tarek (or rubereco) needs to merge the PR in
# GitHub. If branch protection allows auto-merge on
# wip/portfolio-r1, no manual step is needed.
publish_mode: editorial_workflow

# ─── Collections ──────────────────────────────────────────────────────

collections:
  # 1) Films — canonical film records. Adding a film here makes it
  #    available to be referenced by the Work collection below.
  #    v3.14.16: folder-based collection (one file per film in
  #    data/films/<id>.json). Folder collections work reliably with
  #    the relation widget — file collections with a nested list
  #    don't (the relation index comes back empty). A tiny build
  #    step (scripts/build.js) regenerates the legacy data/films.json
  #    aggregate that the production site reads.
  - name: "films"
    label: "Films"
    label_singular: "Film"
    description: "Canonical film records (title, year, role, type, credits)."
    folder: "data/films"
    extension: "json"
    format: "json"
    create: true
    delete: true
    slug: "{{id}}"
    fields:
      - { name: "id",    label: "ID (kebab-case-title-year)", widget: "string", hint: "e.g. els-mals-noms-2025" }
      - { name: "title", label: "Title",   widget: "string" }
      - { name: "year",  label: "Year",    widget: "number", value_type: "int", min: 1950, max: 2100 }
      # v3.14.25: image widget. The field already exists in 10 of
      # 12 film data files (assets/projects/<id>/poster.jpg) and
      # is read by main.js for the homepage poster wall and film
      # modal. It just wasn't in the Decap schema before, so
      # Tarek couldn't edit it from the admin. Now he can browse
      # the existing posters in assets/projects/ or upload a new
      # one. Two films (el-cuco-2023, saw-2026) have no poster
      # yet — the production code skips films without one.
      - name: "poster"
        label: "Poster"
        widget: "image"
        required: false
        allow_external_urls: false
        hint: "Click to browse the media library. Existing posters live in assets/projects/<film-id>/poster.jpg."
      - { name: "role",  label: "Tarek's role on this film", widget: "string", hint: "e.g. Gaffer, Best Boy Electric, Electric" }
      - name: "type"
        label: "Type"
        widget: "select"
        options:
          - { label: "Feature (Largometraje)", value: "Largometraje" }
          - { label: "TV Series (Serie TV)",    value: "Serie TV" }
          - { label: "Short (Cortometraje)",    value: "Cortometraje" }
          - { label: "Commercial",              value: "Comercial" }
          - { label: "Other",                   value: "Otro" }
      - name: "people"
        label: "People on this film"
        widget: "list"
        # v3.14.18: credits.people now references the Jobs
        # collection (data/jobs/) by jobId — a normalized
        # relationship, no free-text role strings. The dropdown
        # shows job name (i18n) so Tarek picks "Director of
        # Photography" not "dop" or "DoP" or "DP". The
        # description is per-credit i18n for the film detail
        # page.
        summary: "{{fields.jobId}} — {{fields.personId}}"
        fields:
          - name: "personId"
            label: "Person"
            widget: "relation"
            collection: "people"
            searchFields: ["name"]
            valueField: "id"
            displayFields: ["name"]
          - name: "jobId"
            label: "Job / role on this film"
            widget: "relation"
            collection: "jobs"
            searchFields: ["name.en", "name.es", "id"]
            valueField: "id"
            displayFields: ["name.en", "category"]
          - name: "description"
            label: "Description (per credit, optional)"
            widget: "object"
            collapsed: true
            required: false
            fields:
              - { name: "en", label: "English", widget: "text", required: false }
              - { name: "es", label: "Spanish", widget: "text", required: false }

  # 2) Jobs — the catalog of possible roles. One file per job in
  #    data/jobs/<id>.json. v3.14.18: new normalized table so the
  #    person is just a collaborator (no role on them), and the
  #    role on a credit references a job here. Adding a new role
  #    is just adding a file here — no schema change.
  - name: "jobs"
    label: "Jobs / roles"
    label_singular: "Job"
    description: "Catalog of roles. Each film credit references one of these by id."
    folder: "data/jobs"
    extension: "json"
    format: "json"
    create: true
    delete: true
    slug: "{{id}}"
    fields:
      - { name: "id", label: "ID (kebab-case)", widget: "string", hint: "e.g. gaffer, dop, sparks" }
      - name: "name"
        label: "Name (i18n)"
        widget: "object"
        fields:
          - { name: "en", label: "English", widget: "string" }
          - { name: "es", label: "Spanish", widget: "string" }
      - name: "category"
        label: "Department category"
        widget: "select"
        options:
          - { label: "Direction",       value: "direction" }
          - { label: "Cinematography",  value: "cinematography" }
          - { label: "Lighting",        value: "lighting" }
          - { label: "Sound",           value: "sound" }
          - { label: "Production",      value: "production" }
          - { label: "Other",           value: "other" }
        hint: "Drives which section the job (and any person partnering in it) shows up in on the partners page. A 'gaffer' is lighting, a 'dop' is cinematography, etc."

  # 3) Work — the ordered list of films shown on the homepage. Each
  #    row references a film by id. Reorder via drag-and-drop in the UI.
  - name: "work"
    label: "Work order"
    label_singular: "Work row"
    description: "Ordered list of films shown in the homepage credits table."
    files:
      - name: "work-data"
        label: "Work rows"
        file: "data/work.json"
        format: "json"
        fields:
          - name: "rows"
            label: "Films in display order"
            widget: "list"
            summary: "→ {{fields.filmId}}"
            fields:
              - name: "filmId"
                label: "Film"
                # v3.14.13: relation widget so the user picks
                # from a searchable dropdown of all films in the
                # Films collection. Search by title, year, or id;
                # dropdown shows title + year. Selected entry's id
                # is stored — matches the existing data shape
                # ({ filmId: "..." } per row).
                widget: "relation"
                collection: "films"
                searchFields: ["title", "year", "id"]
                valueField: "id"
                displayFields: ["title", "year"]

  # 3) People — all people entries. Some are film credits (kind: director,
  #    dop, gaffer, electric), some are partners (relationship: dp | electric).
  #    v3.14.16: folder-based collection. See films comment for the
  #    rationale. One file per person in data/people/<id>.json.
  - name: "people"
    label: "People"
    label_singular: "Person"
    description: "Directors, DPs, gaffers, electrics, and partner collaborators."
    folder: "data/people"
    extension: "json"
    format: "json"
    create: true
    delete: true
    slug: "{{id}}"
    fields:
      - { name: "id",   label: "ID (kebab-case)",  widget: "string", hint: "e.g. juli-carne-martorell" }
      - { name: "name", label: "Name",              widget: "string" }
      # v3.14.18: stripped the 'kind' and 'relationship' and 'works'
      # fields. A person is just a collaborator — the role they
      # played on a specific film lives on that film's credit (as
      # a jobId reference to the Jobs collection). The only role-
      # adjacent field on the person is 'partnership', which is a
      # RELATIONSHIP (not a role) listing which jobs this person
      # partners with Tarek in for the partners page.
      - name: "partnership"
        label: "Partnership (optional — only set for regular collaborators)"
        widget: "object"
        collapsed: true
        required: false
        hint: "Leave empty for one-off film credits. Set this to make the person appear on the partners page in the section(s) for their jobId(s)."
        fields:
          - name: "jobIds"
            label: "Jobs they partner in"
            widget: "list"
            field:
              name: "jobId"
              label: "Job"
              widget: "relation"
              collection: "jobs"
              searchFields: ["name.en", "name.es", "id"]
              valueField: "id"
              displayFields: ["name.en", "category"]
            hint: "The jobs this person regularly partners with Tarek in. A person can partner in multiple jobs (e.g. dop + director). The partners page shows them in each job's section based on its category."
          - { name: "since",     label: "Partner since (year)", widget: "number", value_type: "int", required: false }
          - name: "description"
            label: "Partnership note (i18n, optional)"
            widget: "object"
            collapsed: true
            required: false
            fields:
              - { name: "en", label: "English", widget: "text", required: false }
              - { name: "es", label: "Spanish", widget: "text", required: false }
      # v3.14.25: image widget instead of string. Clicking the
      # field opens the media library popup — browse / preview /
      # pick from existing portraits in assets/images/partners/ or
      # upload a new one. Stores the path as a string under the
      # hood, so no data migration needed.
      - name: "portrait"
        label: "Portrait"
        widget: "image"
        required: false
        allow_external_urls: false
        hint: "Click to browse the media library. Existing portraits live in assets/images/partners/."
      - { name: "imdb",      label: "IMDb id",     widget: "string", required: false }
      - { name: "imdbUrl",   label: "IMDb URL",    widget: "string", required: false }
      - { name: "instagram", label: "Instagram handle", widget: "string", required: false }
      - { name: "instagramUrl", label: "Instagram URL", widget: "string", required: false }
      - name: "description"
        label: "Bio (i18n)"
        widget: "object"
        collapsed: true
        required: false
        hint: "Free-text bio. The structured portfolio (which films they worked on, in which role) is NOT here — it's derived from the film credits, no duplication."
        fields:
          - { name: "en", label: "English", widget: "text", required: false }
          - { name: "es", label: "Spanish", widget: "text", required: false }
      - { name: "url",      label: "Website URL",     widget: "string", required: false }
      - { name: "urlLabel", label: "URL label",       widget: "string", required: false, hint: "e.g. 'Portfolio', 'Website'" }

  # 4) Companies — partner businesses (equipment houses, post houses,
  #    any other non-individual partner).
  - name: "companies"
    label: "Companies"
    label_singular: "Company"
    description: "Equipment houses, post houses, and other partner businesses."
    files:
      - name: "companies-data"
        label: "Companies"
        file: "data/companies.json"
        format: "json"
        fields:
          - name: "companies"
            label: "Companies"
            widget: "list"
            summary: "{{fields.name}} ({{fields.kind}})"
            fields:
              - { name: "id",   label: "ID (kebab-case)", widget: "string", hint: "e.g. movie-men" }
              - { name: "name", label: "Name",             widget: "string" }
              - name: "kind"
                label: "Kind"
                widget: "select"
                options:
                  - { label: "Equipment house", value: "equipment-house" }
                  - { label: "Post-production", value: "post-house" }
                  - { label: "Sound studio",    value: "sound-studio" }
                  - { label: "Other partner",   value: "other" }
              # v3.14.25: image widget so the company logo gets
              # the same media-library popup as people.portrait.
              - name: "logo"
                label: "Logo"
                widget: "image"
                allow_external_urls: false
                hint: "Click to browse the media library. Existing logos live in assets/images/partners/."
              - { name: "logoAlt", label: "Logo alt text", widget: "string", required: false }
              - { name: "count",   label: "Collaboration count (hidden if 0)", widget: "number", value_type: "int", default: 0, required: false }
              - name: "description"
                label: "Description"
                widget: "object"
                collapsed: true
                required: false
                fields:
                  - { name: "en", label: "English", widget: "text", required: false }
                  - { name: "es", label: "Spanish", widget: "text", required: false }
              - { name: "url",      label: "Website URL", widget: "string", required: false }
              - { name: "urlLabel", label: "URL label",   widget: "string", required: false }

  # 5) Site config — single object. Brand name, contact, stats.
  - name: "site"
    label: "Site config"
    label_singular: "Site"
    description: "Brand name, contact info, stats shown on the homepage."
    files:
      - name: "site-data"
        label: "Site"
        file: "data/site.json"
        format: "json"
        fields:
          - { name: "brand", label: "Brand name", widget: "string" }
          - name: "contact"
            label: "Contact"
            widget: "object"
            fields:
              - { name: "email",       label: "Email",         widget: "string" }
              - { name: "imdbId",      label: "IMDb id",       widget: "string", required: false }
              - { name: "imdbUrl",     label: "IMDb URL",      widget: "string", required: false }
              - { name: "instagram",   label: "Instagram handle", widget: "string", required: false }
              - { name: "instagramUrl", label: "Instagram URL",   widget: "string", required: false }
          - name: "stats"
            label: "Stats (shown on the About section)"
            widget: "object"
            fields:
              - { name: "yearsExperience", label: "Years of experience", widget: "number", value_type: "int" }
              - { name: "featureFilms",    label: "Feature films",        widget: "number", value_type: "int" }
              - { name: "availability",    label: "Availability",         widget: "string", hint: "e.g. 'Spain + worldwide'" }

  # 6) Translations — DEFERRED for Phase 1. The data file is too
  #    deeply nested to expose via the `object` widget without
  #    defining every leaf string. The `code` widget only works on
  #    string values, but en/es are objects, so it errors out.
  #    For now, edit data/i18n.json directly via git. Phase 2
  #    will add a structured editor with a full schema for nav,
  #    hero, work, about, partners, footer, etc.
  #
  # When ready to re-enable, replace this block with:
  #   - name: "i18n"
  #     label: "Translations"
  #     files:
  #       - name: "i18n-data"
  #         label: "Translations"
  #         file: "data/i18n.json"
  #         format: "json"
  #         fields:
  #           - { name: "en", label: "English", widget: "object", fields: [ /* full nav, hero, work... schema */ ] }
  #           - { name: "es", label: "Spanish", widget: "object", fields: [ /* same */ ] }
